# Configuración principal del bot.
# Los secretos (claves) van en .env, nunca aquí.

# paper = simulación con precios reales. real = dinero real (bloqueado, ver README).
modo: paper

exchange:
  nombre: binance
  # future = futuros perpetuos USDⓈ-M (permite largos y cortos). spot = solo largos.
  tipo_mercado: future
  # Las órdenes van a Binance Demo Trading; los datos históricos se leen del mercado real (públicos, sin claves).
  demo: true

pares:
  - BTC/USDT
  - ETH/USDT
  - BNB/USDT
  - SOL/USDT
  - XRP/USDT
  - ADA/USDT
  - LINK/USDT
  - AVAX/USDT
  - LTC/USDT
  - DOT/USDT
  - TRX/USDT
  - BCH/USDT
  - XLM/USDT
  - ATOM/USDT
  - UNI/USDT

temporalidad: 1h

historico:
  dias: 730  # ~2 años para backtesting walk-forward

capital:
  simulado_usd: 1000
  # Capital de la cuenta real prevista. Solo se usa para validar que las reglas de riesgo son coherentes.
  real_usd: 50

# Reglas de riesgo FIJAS. El aprendizaje NUNCA puede modificarlas.
riesgo:
  sl_usd_por_operacion: 8          # pérdida máxima en USD si salta el stop loss
  riesgo_max_pct_operacion: 1.0    # el SL en USD no puede superar este % del capital
  max_posiciones: 3
  perdida_diaria_max_pct: 3.0
  drawdown_max_pct: 15.0
  confianza_min_claude: 0.6
  apalancamiento: 1
  hora_cierre_diario_utc: "23:00"  # se cierra todo y no se abren operaciones hasta las 00:00 UTC

# Parámetros de estrategia que el aprendizaje SÍ puede ajustar, siempre dentro de [min, max].
estrategia:
  ema_rapida: {valor: 9, min: 5, max: 21}
  ema_lenta: {valor: 21, min: 20, max: 100}
  periodo_volumen: {valor: 20, min: 20, max: 20}
  multiplicador_volumen: {valor: 1.5, min: 1.2, max: 3.0}
  periodo_rsi: {valor: 14, min: 14, max: 14}
  rsi_compra_min: {valor: 40, min: 40, max: 60}   # zona favorable para largos: rsi_compra_min..rsi_sobrecompra
  rsi_sobrecompra: {valor: 70, min: 65, max: 80}
  confianza_min: {valor: 0.6, min: 0.6, max: 0.85}
  atr_mult_sl: {valor: 1.5, min: 1.0, max: 3.0}   # stop loss técnico a N x ATR del precio de entrada
  ratio_tp: {valor: 2.0, min: 1.5, max: 3.0}      # take profit = N x distancia del stop loss

# Ventana horaria (fija): no se generan señales cuya entrada caiga después del cierre diario
# ni demasiado cerca de él.
senales:
  horas_minimas_antes_cierre: 2

# Supuestos de costos del backtest. Verifica las comisiones reales de tu cuenta (dependen del nivel VIP y de BNB).
backtest:
  comision_pct: 0.05        # por lado (entrada y salida), taker de futuros USDⓈ-M en nivel VIP 0
  slippage_pct: 0.05        # deslizamiento en órdenes a mercado y stops
  funding_pct_8h: 0.01      # se cobra SIEMPRE como costo (supuesto conservador) a las 00, 08 y 16 UTC
  nocional_min_usd: 5       # posición mínima; el mínimo real por par se leerá del exchange en la Fase 5
  walk_forward:
    entrenamiento_meses: 6
    prueba_meses: 2
    min_operaciones_entrenamiento: 30
    # Combinaciones a probar en cada ventana de entrenamiento (todas dentro de los rangos de `estrategia`).
    rejilla:
      ema: [[9, 21], [12, 26], [20, 50]]
      multiplicador_volumen: [1.2, 1.5, 2.0]
      atr_mult_sl: [1.0, 1.5, 2.0]
      ratio_tp: [1.5, 2.0, 3.0]

# Ejecución en paper trading. Dos carteras simuladas corren en paralelo con los MISMOS precios y señales:
#   tecnico_claude: señal técnica -> Claude -> capa de riesgo -> orden
#   tecnico_solo:   señal técnica ---------> capa de riesgo -> orden   (grupo de control para medir si Claude aporta)
ejecucion:
  broker: simulado              # simulado (recomendado) | binance_demo (envía órdenes reales a demo.binance.com)
  distancia_stop_min_pct: 0.2   # stops más cercanos que esto se bloquean (el ruido los saltaría y el tamaño sería enorme)
  distancia_stop_max_pct: 10.0  # stops más lejanos que esto se bloquean
  minuto_ciclo: 1               # el ciclo principal corre cada hora en el minuto 1 (vela recién cerrada)
  segundos_monitor: 60          # cada cuánto se revisan stop loss / take profit con el precio actual

claude:
  modelo: claude-sonnet-5
  presupuesto_mensual_usd: 15   # al alcanzarlo el bot deja de llamar a Claude y NO abre operaciones
  esfuerzo_decision: medium     # low | medium | high: más esfuerzo = mejor razonamiento pero más costo
  esfuerzo_noticias: low
  max_noticias_por_llamada: 15
  # Precios en USD por millón de tokens (verifícalos en https://www.anthropic.com/pricing si cambian).
  precios_usd_por_millon: {entrada: 2.0, salida: 10.0, cache_lectura: 0.2, cache_escritura: 2.5}

noticias:
  fuentes_rss:
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://cointelegraph.com/rss
    - https://decrypt.co/feed
  intervalo_minutos: 30         # cada cuánto se revisan las fuentes
  horas_contexto: 24            # noticias de las últimas N horas que ve Claude al decidir
  min_muestras_estadistica: 5   # mínimo de noticias parecidas para citar su impacto histórico

telegram:
  habilitado: false

rutas:
  base_datos: data/bot.db
  logs: logs/bot.log
